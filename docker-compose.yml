services:
  llservicios-v2:
    image: llservicios-v2:prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llservicios-v2
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - MIGRATE=true
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    networks:
      - redPrincipal
    restart: always
    # ports:
    #   - "1234:80"

  llservicios-scheduler-v2:
    image: llservicios-v2:prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llservicios-scheduler-v2
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /tmp/permissions_set ]; then
          chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache
          chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
          touch /tmp/permissions_set
        fi
        while true; do
          php /var/www/html/artisan schedule:work --verbose --no-interaction
          echo "Scheduler stopped. Restarting in 5 seconds..."
          sleep 5
        done
    stdin_open: true
    tty: true
    healthcheck:
      disable: true
    networks:
      - redPrincipal
    restart: always

  llservicios-queue-worker-v2:
    image: llservicios-v2:prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llservicios-queue-worker-v2
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /tmp/permissions_set ]; then
          chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache
          chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
          touch /tmp/permissions_set
        fi
        while true; do
          php /var/www/html/artisan queue:work \
            --sleep=3 \
            --tries=3 \
            --max-time=3600 \
            --timeout=300 \
            --memory=512 \
            --queue=notificaciones,default \
            --verbose
          echo "Worker stopped. Restarting in 5 seconds..."
          sleep 5
        done
    networks:
      - redPrincipal
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  llservicios-queue-high-v2:
    image: llservicios-v2:prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llservicios-queue-high-v2
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /tmp/permissions_set ]; then
          chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache
          chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
          touch /tmp/permissions_set
        fi
        while true; do
          php /var/www/html/artisan queue:work \
            --sleep=1 \
            --tries=3 \
            --max-time=3600 \
            --timeout=120 \
            --memory=256 \
            --queue=alta \
            --verbose
          echo "High worker stopped. Restarting in 5 seconds..."
          sleep 5
        done
    networks:
      - redPrincipal
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  redPrincipal:
    external: true
