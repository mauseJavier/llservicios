name: tests

on:
  push:
    branches: [devmause, master, feature/upgrade-laravel]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: soap, zip, bcmath, gd, pdo_mysql, sqlite3
          coverage: none

      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Suite de tests
        run: php vendor/bin/phpunit --do-not-cache-result --colors=never

      - name: Pint (archivos modificados)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACM "$BASE" -- '*.php')
          if [ ${#files[@]} -gt 0 ]; then
            vendor/bin/pint --test "${files[@]}"
          else
            echo "Sin archivos PHP modificados"
          fi

      - name: Ciclo de cache
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan route:list > /dev/null
          php artisan optimize:clear

  migrations:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: llservicios_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: llservicios_test
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: soap, zip, bcmath, gd, pdo_mysql
          coverage: none

      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migraciones up
        run: php artisan migrate:fresh --force

      - name: Migraciones down
        run: php artisan migrate:rollback --step=all --force
