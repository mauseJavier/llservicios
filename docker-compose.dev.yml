services:
  localllservicios-v2:
    build:
      context: .
      dockerfile: Dockerfile
    image: localllservicios-v2:local
    container_name: localllservicios-v2
    environment:
      - MIGRATE=true
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public
      - ./database:/var/www/html/database
      - ./tests:/var/www/html/tests
    networks:
      - redPrincipal
    restart: always
    #QUITAR LOS PUERTOS Y LA DEPENDENCIA DE MARIADB
    ports:
      - "1234:80"


  localllfactura-scheduler-v2:
    build:
      context: .
      dockerfile: Dockerfile
    image: localllservicios-v2:local
    container_name: localllservicios-scheduler-v2
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public
      - ./database:/var/www/html/database
    entrypoint: ["/bin/sh", "-c", "chmod -R 777 /var/www/html/storage /var/www/html/bootstrap/cache && while true; do php /var/www/html/artisan schedule:run --no-interaction & sleep 60; done"]
    networks:
      - redPrincipal
    restart: always


  localllfactura-queue-worker-v2:
    build:
      context: .
      dockerfile: Dockerfile
    image: localllservicios-v2:local
    container_name: localllservicios-queue-worker-v2
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public
      - ./database:/var/www/html/database
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /tmp/permissions_set ]; then
          chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache
          chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
          touch /tmp/permissions_set
        fi
        # Loop infinito para auto-reinicio
        while true; do
          php /var/www/html/artisan queue:work \
            --sleep=3 \
            --tries=3 \
            --max-time=3600 \
            --timeout=300 \
            --memory=512 \
            --queue=notificaciones,default \
            --verbose
          echo "Worker stopped. Restarting in 5 seconds..."
          sleep 5
        done
    networks:
      - redPrincipal
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'queue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3


  localllservicios-queue-high-v2:
    build:
      context: .
      dockerfile: Dockerfile
    image: localllservicios-v2:local
    container_name: localllservicios-queue-high-v2
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public
      - ./database:/var/www/html/database
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /tmp/permissions_set ]; then
          chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache
          chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
          touch /tmp/permissions_set
        fi
        while true; do
          php /var/www/html/artisan queue:work \
            --sleep=1 \
            --tries=3 \
            --max-time=3600 \
            --timeout=120 \
            --memory=256 \
            --queue=alta \
            --verbose
          echo "High worker stopped. Restarting in 5 seconds..."
          sleep 5
        done
    networks:
      - redPrincipal
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'queue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  redPrincipal:
    external: true
